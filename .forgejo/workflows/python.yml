name: Test

# Forge gate for a Python repo, committed by `hub-api repo provision --kind python`, at parity with
# the hub's own pytest job (operator, 2026-10-18: "the same standards for CI ... in every repo now
# and in the future"). CI-Scope picks the test files a diff can reach from the repo's OBSERVED impact
# map, and runs everything whenever it cannot tell; ci-xdist-n picks -n from the runner's CPU cap;
# two PR gates read the change itself. The repo-specific half is `.ci-scope.json` at the root
# (tests_dir, map, path_roots, machinery); the map is re-recorded weekly by the box's refresh job.
# The repo's branch protection requires `Test /*`, the contexts this workflow registers.
#
# A present `.forgejo/workflows` is read INSTEAD of `.github/workflows`. The runner is host-mode
# (labels ubuntu-latest:host): tools install into the job's own venv, never the shared runner home.
# pytest exits 5 when it collects nothing, so a repo without tests is RED here. Adapt the install
# step to the repo's real dependencies.

on:
  pull_request:
  # No `push:` and no `workflow_dispatch:` -- CI is preventative only, nothing runs after a merge (operator, 2026-09-15).

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A draft waits off the runner: the queue un-drafts it at the front, and that edit runs this.
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Admission — a held PR must report not-passing, never green
        if: ${{ contains(github.event.pull_request.labels.*.name, 'queue:not-admitted') }}
        run: |
          echo "held: queue:not-admitted is attached, so this gate is suppressed and must not pass"
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CI-Scope
          ref: v0.4.0
          path: .ci-scope
      - name: Install into a job venv
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -q pytest pytest-xdist pyyaml
          if [ -f requirements.txt ]; then .ci-venv/bin/pip install -q -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then .ci-venv/bin/pip install -q -e .; fi
      - name: Where the tests live (.ci-scope.json tests_dir)
        id: cfg
        run: python3 -c 'import json; print("tests_dir=" + json.load(open(".ci-scope.json"))["tests_dir"])' | tee -a "$GITHUB_OUTPUT"
      - name: Collection check — an aborted collection hides an unknown number of tests
        run: .ci-venv/bin/python -m pytest ${{ steps.cfg.outputs.tests_dir }} --collect-only -q
      - name: Which test files can this diff reach?
        id: scope
        if: github.event_name == 'pull_request'
        run: .ci-scope/bin/ci-pytest-scope | tee -a "$GITHUB_OUTPUT"
      - name: Decide -n by reading the runner's CPU cap (1 if capped under one core, else 4)
        id: xdist
        run: echo "n=$(.ci-scope/bin/ci-xdist-n)" | tee -a "$GITHUB_OUTPUT"
      - name: pytest
        run: .ci-venv/bin/python -m pytest ${{ steps.scope.outputs.targets || steps.cfg.outputs.tests_dir }} -q -n ${{ steps.xdist.outputs.n }} -rfsE --durations=30
      - name: Tree state and survivors after the suite
        if: always()
        run: |
          echo "tree state: $(git status --porcelain --untracked-files=all | wc -l | tr -d ' ') path(s) changed"
          git status --porcelain --untracked-files=all | head -50
          echo "processes younger than this job:"
          ps -eo pid,ppid,etimes,stat,args --sort=etimes | awk 'NR==1 || ($3 < 2400 && ++n <= 40)'
      - name: New tests must fail on the base
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}" || true
          # ABSOLUTE, because the base run's cwd is a temporary worktree: `.ci-scope.json`'s relative
          # `.ci-venv/bin/python` is FileNotFoundError there, on exactly the PRs that add a test.
          rc=0; NTFB_PYTEST="$PWD/.ci-venv/bin/python -m pytest" .ci-scope/bin/ci-new-tests-fail-on-base > ntfb.txt || rc=$?
          cat ntfb.txt; cat ntfb.txt >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Removed assertions need a stated reason (report-only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}" || true
          rc=0; .ci-scope/bin/ci-removed-assertions > rma.txt || rc=$?
          cat rma.txt; cat rma.txt >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Record whether this PR run was full or scoped
        if: github.event_name == 'pull_request' && always()
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          TARGETS: ${{ steps.scope.outputs.targets }}
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          if [ "${MODE}" = "scoped" ] && [ -n "${TARGETS}" ]; then
            line="pytest: scoped: $(printf '%s\n' ${TARGETS} | wc -l | tr -d ' ') file(s) -- ${REASON}"
          else
            line="pytest: full -- ${REASON:-no scope verdict: the whole suite ran}"
          fi
          echo "$line"; echo "$line" >> "$GITHUB_STEP_SUMMARY"
